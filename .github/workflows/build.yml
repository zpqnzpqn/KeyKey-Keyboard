name: Build & Test macOS App

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Select Xcode Version
      run: sudo xcode-select -s /Applications/Xcode_15.4.app || sudo xcode-select -s /Applications/Xcode.app

    - name: Build macOS App
      run: |
        xcodebuild -project KeyKey.xcodeproj -scheme KeyKey -configuration Release build CODE_SIGNING_ALLOWED=NO
